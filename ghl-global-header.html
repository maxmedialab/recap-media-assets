<!-- Preloader — covers the page while CDN CSS/JS loads -->
<style>
    #rm-splash { position: fixed; inset: 0; z-index: 99999; background: #0C0A10; display: flex; align-items: center; justify-content: center; transition: opacity 0.45s ease; }
    #rm-splash.hidden { opacity: 0; pointer-events: none; }
    #rm-splash img { width: 120px; height: auto; animation: rm-pulse 1.2s ease-in-out infinite; }
    @keyframes rm-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.96)} }
    /* Splash failsafe (2026-07-04): the ONLY thing that removes the splash is the
       Global Footer script — if that section fails to inject or its JS errors out,
       every page stays a solid black screen forever. This pure-CSS animation fades
       the splash out at 6s with no JS required. Harmless on the normal path: the
       footer script removes the node long before 6s. */
    @keyframes rm-splash-failsafe { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    #rm-splash { animation: rm-splash-failsafe 0.45s ease 6s forwards; }
    /* Grain critical CSS — inlined 2026-06-18 to stop the full-opacity grain "static" flash before jsDelivr style.css loads (mirrors css/style.css L2806–2807) */
    .grain { position: fixed; inset: 0; pointer-events: none; z-index: 10; opacity: 0.028; mix-blend-mode: overlay; }
    .grain svg { width: 100%; height: 100%; }
</style>
<!-- No-JS failsafe (2026-07-04): with JS disabled nothing can dismiss the splash — hide it outright -->
<noscript><style>#rm-splash { display: none !important; }</style></noscript>
<div id="rm-splash">
    <img src="https://cdn.jsdelivr.net/gh/maxmedialab/recap-media-assets@d7652bd/images/69e9d70ea1636a6c65695174.webp" alt="Loading Recap Media">
</div>

<!-- Grain texture overlay -->
<div class="grain" aria-hidden="true">
    <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <filter id="grain-filter">
            <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch"/>
        </filter>
        <rect width="100%" height="100%" filter="url(#grain-filter)"/>
    </svg>
</div>
